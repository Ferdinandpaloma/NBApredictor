name: Build predictions

on:
  schedule:
    - cron: "17 13 * * *"   # daily, ~6am Pacific (cron is UTC)
  workflow_dispatch:         # "Run workflow" button for manual builds
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build predictions
        # NBA's feeds block some cloud IPs; keep the last committed data if so.
        continue-on-error: true
        run: python -m scripts.build

      - name: Build player props
        # NBA's feeds block some cloud IPs; keep the last committed data if so.
        continue-on-error: true
        run: python -m scripts.build_props

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build site
        run: npm ci && npm run build

      - name: Commit updated JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/*.json site/players data/player_logs.csv
          git diff --cached --quiet || git commit -m "Update predictions $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
