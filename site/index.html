<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Elo Picks</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --bar:#2563eb; --bar2:#d6d3d1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --line:#292524; --bar:#60a5fa; --bar2:#44403c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:28px 0 8px; }
  .meta { color:var(--muted); font-size:13px; }
  .game { padding:12px 0; border-bottom:1px solid var(--line); }
  .row { display:flex; justify-content:space-between; font-variant-numeric:tabular-nums; }
  .bar { display:flex; height:6px; border-radius:3px; overflow:hidden; margin:6px 0 2px; background:var(--bar2); }
  .bar span { background:var(--bar); }
  .small { font-size:12px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td { padding:5px 0; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; }
</style>
</head>
<body>
<main>
  <h1>NBA Elo Picks</h1>
  <div class="meta" id="meta">Loading…</div>
  <div id="games"></div>
  <h2>Power ratings</h2>
  <table id="ratings"></table>
</main>
<script>
const pct = p => Math.round(p * 100) + "%";
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });

Promise.all(["predictions", "ratings", "meta"].map(f => fetch(f + ".json").then(r => r.json())))
  .then(([preds, ratings, meta]) => {
    const bt = meta.backtest || {};
    document.getElementById("meta").textContent =
      `Season ${meta.season} · updated ${new Date(meta.built_at).toLocaleString()}` +
      (bt.accuracy ? ` · backtest ${pct(bt.accuracy)} over ${bt.games.toLocaleString()} games` : "");

    const byDate = {};
    preds.forEach(g => (byDate[g.date] ||= []).push(g));
    const out = document.getElementById("games");
    if (!preds.length) out.innerHTML = '<p class="meta">No upcoming games.</p>';
    Object.keys(byDate).sort().forEach(d => {
      out.insertAdjacentHTML("beforeend", `<h2>${fmtDate(d)}</h2>`);
      byDate[d].forEach(g => {
        const fav = g.home_spread <= 0 ? g.home : g.away;
        out.insertAdjacentHTML("beforeend", `
          <div class="game">
            <div class="row"><strong>${g.away} @ ${g.home}</strong><span>${fav} −${Math.abs(g.home_spread)}</span></div>
            <div class="bar"><span style="width:${g.away_win_prob * 100}%"></span></div>
            <div class="row small"><span>${g.away} ${pct(g.away_win_prob)}</span><span>${g.home} ${pct(g.home_win_prob)}</span></div>
          </div>`);
      });
    });

    document.getElementById("ratings").innerHTML = ratings
      .map((t, i) => `<tr><td>${i + 1}. ${t.team}</td><td>${Math.round(t.elo)}</td></tr>`).join("");
  })
  .catch(e => { document.getElementById("meta").textContent = "Couldn't load predictions: " + e; });
</script>
</body>
</html>
